name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Defaults match production aupairly project; secrets override if set
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_oGAZjNJBveFmWZpLsHDCVVhK' }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_Xkd1WRxncxzJRvTp6FrY7s4l2VcG' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

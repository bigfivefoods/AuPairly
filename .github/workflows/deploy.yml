name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Defaults match production aupairly project; secrets override if set
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_oGAZjNJBveFmWZpLsHDCVVhK' }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_Xkd1WRxncxzJRvTp6FrY7s4l2VcG' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Production already deploys through the Vercel Git integration.
      # This job only runs when VERCEL_TOKEN is configured, so a missing
      # secret does not fail the workflow.
      - name: Check VERCEL_TOKEN
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN is not configured. Skipping GitHub Actions deploy."
            echo "Production continues to deploy through the Vercel Git integration."
            echo "Add the VERCEL_TOKEN repository secret to run this job, or remove the workflow."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        if: steps.token.outputs.present == 'true'
        run: npm i -g vercel@latest

      - name: Pull Vercel env
        if: steps.token.outputs.present == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.token.outputs.present == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        if: steps.token.outputs.present == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
